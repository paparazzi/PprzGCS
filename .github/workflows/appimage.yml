name: AppImage

on:
  push:
      tags:
      - '**'
  pull_request:  # builds and tests the AppImage when its build changes
    paths:
      - 'make_appimage.sh'
      - 'install_deps.sh'
      - '.github/workflows/appimage.yml'
  workflow_dispatch:  # builds the AppImage without releasing it

jobs:
  build-appimage:

    # the oldest supported release: the AppImage uses the glibc of the system, so it runs on the newer ones too
    runs-on: ubuntu-22.04

    outputs:
      version: ${{ steps.setenv.outputs.version }}

    steps:
      - name: Checkout repository and submodules
        uses: actions/checkout@v5
        with:
          submodules: recursive
          path: ./pprzgcs
      
      - name: setEnv
        id: setenv
        run: |
          export MAKEFLAGS=-j$(nproc)
          PPRZGCS_VERSION=$(echo "${{ github.ref }}" | sed 's/refs.tags.\(.*\)/\1/g' | sed 's/\//_/g')
          PPRZGCS_VERSION="${PPRZGCS_VERSION:-$(git -C pprzgcs describe --tags --always)}"
          echo "VERSION: $PPRZGCS_VERSION"
          echo "PPRZGCS_VERSION=$PPRZGCS_VERSION" >> $GITHUB_ENV
          echo "version=$PPRZGCS_VERSION" >> $GITHUB_OUTPUT
          echo "VERSION: ${{ env.PPRZGCS_VERSION }}"
        
      - name: Install dependencies
        run: ./pprzgcs/install_deps.sh --yes appimage
      

      - name: build
        run: |
          ./pprzgcs/make_appimage.sh $(pwd)/build_appimage $(pwd)/pprzgcs
      - uses: actions/upload-artifact@v5
        with:
          name: AppImage_${{ env.PPRZGCS_VERSION }}
          path: 'build_appimage/PprzGCS*.AppImage*'

      - name: rename AppImage
        run: |
          find . -iname "*appimage*"
          mv ./build_appimage/PprzGCS-x86_64.AppImage PprzGCS_${{ env.PPRZGCS_VERSION }}-x86_64.AppImage

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          token: '${{ secrets.GITHUB_TOKEN }}'
          files: 'PprzGCS_${{ env.PPRZGCS_VERSION }}-x86_64.AppImage'

  # the AppImage built on 22.04 also starts on the newer releases
  test-appimage:
    needs: build-appimage
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-26.04]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/download-artifact@v5
        with:
          name: AppImage_${{ needs.build-appimage.outputs.version }}

      - name: Install a display server
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends xvfb xauth

      - name: Run
        # extracted, as FUSE 2 is not installed on the newer releases
        run: |
          chmod +x PprzGCS-x86_64.AppImage
          xvfb-run -a ./PprzGCS-x86_64.AppImage --appimage-extract-and-run --version
